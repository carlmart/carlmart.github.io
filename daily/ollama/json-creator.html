<!DOCTYPE html>
<html>
<body>

  <h3>Conversation Logger</h3>
  <label for="sentence">Sentence (User):</label><br>
  <input type="text" id="sentence" placeholder="Enter sentence"><br><br>
  
  <label for="paragraph">Paragraph (Assistant):</label><br>
  <textarea id="paragraph" rows="4" cols="50" placeholder="Enter paragraph"></textarea><br><br>
  
  <button onclick="addRecord()">Submit Record</button>
  <button onclick="saveToJSON()">Save to File</button>
  
  <p id="status" style="color: blue; font-weight: bold;"></p>

  <script>
    // Global array persists as long as the page is not refreshed
    let conversationData = [];

    function getFormattedDate() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    function addRecord() {
      const sentenceInput = document.getElementById('sentence');
      const paragraphInput = document.getElementById('paragraph');
      const sentenceVal = sentenceInput.value.trim();
      const paragraphVal = paragraphInput.value.trim();
      
      if (!sentenceVal && !paragraphVal) {
        alert("Please enter text before adding.");
        return;
      }

      const timestamp = getFormattedDate();
      let addedCount = 0;

      // Add User Entry if present
      if (sentenceVal) {
        conversationData.push({
          "role": "user",
          "content": sentenceVal,
          "timestamp": timestamp
        });
        addedCount++;
      }

      // Add Assistant Entry if present
      if (paragraphVal) {
        conversationData.push({
          "role": "assistant",
          "content": paragraphVal,
          "timestamp": timestamp
        });
        addedCount++;
      }

      // Clear inputs
      sentenceInput.value = '';
      paragraphInput.value = '';
      
      // Confirm to user
      document.getElementById('status').innerText = `Success! ${addedCount} entries added.`;
      // debug document.getElementById('status').innerText = `Success! ${addedCount} entries added. Total records in memory: ${conversationData.length}`;
      console.log("Current Data:", conversationData); // Check browser console (F12) to verify
    }

    function saveToJSON() {
      if (conversationData.length === 0) {
        alert("Error: No records found in memory. Did you click 'Add Another Record' first?");
        return;
      }

      const jsonString = JSON.stringify(conversationData, null, 4);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `chat_log_${new Date().toISOString().slice(0,19).replace(/:/g,"-")}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      document.getElementById('status').innerText += " | File downloaded!";
    }
  </script>

</body>
</html>
